name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # ta sama wersja, w ktorej budowany i testowany jest pakiet Sklepu
          python-version: "3.12"

      - name: Install Tesseract (zrodlo wbudowanego silnika, wersja przypieta)
        run: choco install tesseract --version=5.3.1.20230401 -y --no-progress

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip

      - name: Vendor OCR engine and dictionaries
        run: |
          python scripts/vendor_tesseract.py
          python scripts/vendor_dictionaries.py

      - name: Tests
        # -rs: pokaz pominiete testy (np. GUI bez ekranu), zeby nie znikaly po cichu
        run: python -m pytest -rs
