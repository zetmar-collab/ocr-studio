name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      # Silnik OCR jest wbudowywany w aplikacje, ale jego binaria nie sa
      # trzymane w repozytorium (vendor/ jest w .gitignore). Instalujemy
      # Tesseract na runnerze i odtwarzamy z niego vendor/ przed buildem.
      - name: Install Tesseract (zrodlo wbudowanego silnika)
        run: choco install tesseract -y

      - name: Vendor OCR engine
        run: python scripts/vendor_tesseract.py

      - name: Build EXE
        run: python build_exe.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = python -c "from src.config import APP_VERSION; print(APP_VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\OCR_Studio_Setup.iss" "/DMyAppVersion=$version"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OCR Studio.exe
            installer/output/OCR_Studio_Setup_*.exe
          generate_release_notes: true
